name: 'YNaMi CI/CD'
on: push
env:
  JAVA_VERSION: 23
  MYSQL_VERSION: 8.0
  UPLOADED_ARTIFACTS_DIR: 'gh-pages'
  TESTS_UPLOADED_ARTIFACTS_DIR: 'test-results'
  UNIT_TESTS_XMLS_DIR: 'target/test-results/unit-tests/*.xml'
  INTEGRATION_TESTS_XMLS_DIR: 'target/test-results/integration-tests/*.xml'

jobs:
  build:
    # Here's whats part of the ubuntu-24.04 GitHub Runner Image:
    # https://github.com/actions/runner-images/blob/main/images/linux/Ubuntu2204-Readme.md
    runs-on: ubuntu-24.04

    steps:
      - name: 'Get the latest code from the `${{ github.repository }}` repository'
        uses: actions/checkout@v3
      - name: 'Set up the JDK `${{ env.JAVA_VERSION }}`'
        uses: './.github/actions/install-java'
        with:
          JAVA_VERSION_TO_INSTALL: ${{ env.JAVA_VERSION }}
      - name: 'Cache Maven packages'
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: 'Compiles the application code'
        run: mvn clean compile test-compile --file pom.xml

  unit-tests:
    runs-on: ubuntu-24.04

    steps:
      - name: 'Get the latest code from the `${{ github.repository }}` repository'
        uses: actions/checkout@v3
      - name: 'Set up the JDK `${{ env.JAVA_VERSION }}`'
        uses: './.github/actions/install-java'
        with:
          JAVA_VERSION_TO_INSTALL: ${{ env.JAVA_VERSION }}
      - name: 'Run the unit tests'
        run: mvn -Djacoco.haltOnFailure=false clean test -Dmaven.test.failure.ignore=true -P ut --file pom.xml
      - name: 'Unit Tests'' Summary'
        if: success() || failure()
        uses: test-summary/action@v2
        with:
          show: "fail"
          paths: "${{ env.UNIT_TESTS_XMLS_DIR }}"
      - name: 'Uploads the results to ${{ env.TESTS_UPLOADED_ARTIFACTS_DIR }}-${{ github.job }} folder'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TESTS_UPLOADED_ARTIFACTS_DIR }}-${{ github.job }} # Name of the folder
          path: target/test-results                                       # Path to test report
      - name: 'Report'
        id: unit_tests_report
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          fail-on-error: true
          reporter: java-junit
          name: 'Unit Tests'' Report'
          path: ${{ env.UNIT_TESTS_XMLS_DIR }}
      - name: 'Add Test Report URL to Summary'
        if: success() || failure()
        run: |
          echo "### [View Unit Test Report](${{ steps.unit_tests_report.outputs.url_html }})" >> $GITHUB_STEP_SUMMARY
          echo "::notice title=Unit Test Report::[Click to view Unit Test Report](${{ steps.unit_tests_report.outputs.url_html }})"

  migration-tests:
    runs-on: ubuntu-24.04

    steps:
      - name: 'Get the latest code from the `${{ github.repository }}` repository'
        uses: actions/checkout@v3
      - name: 'Set up GitHup runner'
        uses: './.github/actions/setup-runner'
        with:
          WITH_MYSQL: 'TRUE'
          JAVA_VERSION_TO_INSTALL: ${{ env.JAVA_VERSION }}
      - name: 'Run the migration tests'
        run: mvn clean test -Dmaven.test.failure.ignore=true -P mt --file pom.xml
      - name: 'Migration Tests'' Summary'
        if: success() || failure()
        uses: test-summary/action@v2
        with:
          show: "fail"
          paths: "${{ env.UNIT_TESTS_XMLS_DIR }}"
      - name: 'Uploads the results to ${{ env.TESTS_UPLOADED_ARTIFACTS_DIR }}-${{ github.job }} folder'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TESTS_UPLOADED_ARTIFACTS_DIR }}-${{ github.job }} # Name of the folder
          path: target/test-results                                       # Path to test report
      - name: 'Report'
        id: migration_tests_report
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          fail-on-error: true
          reporter: java-junit
          name: 'DB Migration Tests'' Report'
          path: ${{ env.UNIT_TESTS_XMLS_DIR }}
      - name: 'Add Test Report URL to Summary'
        if: success() || failure()
        run: |
          echo "### [View Migration Test Report](${{ steps.migration_tests_report.outputs.url_html }})" >> $GITHUB_STEP_SUMMARY
          echo "::notice title=Migration Test Report::[Click to view Migration Test Report](${{ steps.migration_tests_report.outputs.url_html }})"

  integration-tests-h2:
    runs-on: ubuntu-24.04

    steps:
      - name: 'Get the latest code from the `${{ github.repository }}` repository'
        uses: actions/checkout@v3
      - name: 'Set up the JDK `${{ env.JAVA_VERSION }}`'
        uses: './.github/actions/install-java'
        with:
          JAVA_VERSION_TO_INSTALL: ${{ env.JAVA_VERSION }}
      - name: 'Run the integration tests'
        run: mvn -Djacoco.skip=true clean integration-test -Dmaven.test.failure.ignore=true -P it,h2 --file pom.xml
      - name: 'Integration Tests'' with H2 - Summary'
        if: success() || failure()
        uses: test-summary/action@v2
        with:
          show: "fail"
          paths: "${{ env.INTEGRATION_TESTS_XMLS_DIR }}"
      # Intentionally not uploading the H2 tests' result to avoid conflicts with other integration tests run with MySQL
      - name: 'Report'
        id: h2_integration_tests_report
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          fail-on-error: true
          reporter: java-junit
          name: 'Integration Tests'' Report (H2)'
          path: ${{ env.INTEGRATION_TESTS_XMLS_DIR }}
      - name: 'Add Test Report URL to Summary'
        if: success() || failure()
        run: |
          echo "### [View H2 Integration Test Report](${{ steps.h2_integration_tests_report.outputs.url_html }})" >> $GITHUB_STEP_SUMMARY
          echo "::notice title=H2 Integration Test Report::[Click to view H2 Integration Test Report](${{ steps.h2_integration_tests_report.outputs.url_html }})"

  integration-tests-mysql:
    runs-on: ubuntu-24.04

    steps:
      - name: 'Get the latest code from the `${{ github.repository }}` repository'
        uses: actions/checkout@v3
      - name: 'Set up GitHup runner'
        uses: './.github/actions/setup-runner'
        with:
          WITH_MYSQL: 'TRUE'
          JAVA_VERSION_TO_INSTALL: ${{ env.JAVA_VERSION }}
      - name: 'Run the integration tests'
        run: mvn -Djacoco.haltOnFailure=false clean integration-test -Dmaven.test.failure.ignore=true -P it,mysql --file pom.xml
      - name: 'Integration Tests'' with MySQL - Summary'
        if: success() || failure()
        uses: test-summary/action@v2
        with:
          show: "fail"
          paths: "${{ env.INTEGRATION_TESTS_XMLS_DIR }}"
      - name: 'Uploads the results to ${{ env.TESTS_UPLOADED_ARTIFACTS_DIR }}-${{ github.job }} folder'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TESTS_UPLOADED_ARTIFACTS_DIR }}-${{ github.job }} # Name of the folder
          path: target/test-results                                       # Path to test report
       # TODO: Jacoco report for IT isn't correct. It shows the results of the merged report on CI somehow. Uploading the
       # target/site didn't work as well, so need to find the issue and fix it properly.
      - name: 'Uploads the site to ${{ env.UPLOADED_ARTIFACTS_DIR }}-${{ github.job }} folder'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.UPLOADED_ARTIFACTS_DIR }}-${{ github.job }} # Name of the folder
          path: target/site                                         # Path to site folder
      - name: 'Report'
        id: mysql_integration_tests_report
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          fail-on-error: true
          reporter: java-junit
          name: 'Integration Tests'' Report (MySQL)'
          path: ${{ env.INTEGRATION_TESTS_XMLS_DIR }}
      - name: 'Add Test Report URL to Summary'
        if: success() || failure()
        run: |
          echo "### [View MySQL Integration Test Report](${{ steps.mysql_integration_tests_report.outputs.url_html }})" >> $GITHUB_STEP_SUMMARY
          echo "::notice title=MySQL Integration Test Report::[Click to view MySQL Integration Test Report](${{ steps.mysql_integration_tests_report.outputs.url_html }})"

  bdd-cucumber-tests:
    runs-on: ubuntu-24.04

    steps:
      - name: 'Get the latest code from the `${{ github.repository }}` repository'
        uses: actions/checkout@v3
      - name: 'Set up GitHup runner'
        uses: './.github/actions/setup-runner'
        with:
          WITH_MYSQL: 'TRUE'
          WITH_GOOGLE_CHROME_INFO: 'TRUE'
          JAVA_VERSION_TO_INSTALL: ${{ env.JAVA_VERSION }}
      # No need to set up/install Google Chrome explicitly as it is already installed on the GitHub Runner Image
#      - name: 'Install Google Chrome'
#        run: |
#          wget https://dl.google.com/linux/chrome/deb/pool/main/g/google-chrome-stable/google-chrome-stable_116.0.5845.140-1_amd64.deb
#          sudo dpkg -i ./google-chrome-stable_116.0.5845.140-1_amd64.deb
      - name: 'Run the acceptance-cucumber tests'
        run: browser=chrome headless_mode=true environment=CI mvn clean test -P bt,mysql --file pom.xml
      - name: 'BDD Cucumber Tests'' Summary'
        if: success() || failure()
        uses: test-summary/action@v2
        with:
          show: "fail"
          paths: "${{ env.UNIT_TESTS_XMLS_DIR }}"
      # target/test-results were not uploaded earlier, see if it causes any issues in generated reports
      - name: 'Uploads the results to ${{ env.TESTS_UPLOADED_ARTIFACTS_DIR }}-${{ github.job }} folder'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TESTS_UPLOADED_ARTIFACTS_DIR }}-${{ github.job }} # Name of the folder
          path: target/test-results                                       # Path to test report
      - name: 'Uploads the site to ${{ env.UPLOADED_ARTIFACTS_DIR }}-${{ github.job }} folder'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.UPLOADED_ARTIFACTS_DIR }}-${{ github.job }} # Name of the folder
          path: target/site                                         # Path to site folder
      - name: 'Report'
        id: bdd_cucumber_tests_report
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          fail-on-error: true
          reporter: java-junit
          name: 'BDD Cucumber Tests'' Report'
          path: ${{ env.UNIT_TESTS_XMLS_DIR }}
      - name: 'Add Test Report URL to Summary'
        if: success() || failure()
        run: |
          echo "### [View BDD Cucumber Test Report](${{ steps.bdd_cucumber_tests_report.outputs.url_html }})" >> $GITHUB_STEP_SUMMARY
          echo "::notice title=BDD Cucumber Test Report::[Click to view BDD Cucumber Test Report](${{ steps.bdd_cucumber_tests_report.outputs.url_html }})"

  acceptance-selenium-tests:
    runs-on: ubuntu-24.04

    steps:
      - name: 'Get the latest code from the `${{ github.repository }}` repository'
        uses: actions/checkout@v3
      - name: 'Set up GitHup runner'
        uses: './.github/actions/setup-runner'
        with:
          WITH_MYSQL: 'TRUE'
          WITH_GOOGLE_CHROME_INFO: 'TRUE'
          JAVA_VERSION_TO_INSTALL: ${{ env.JAVA_VERSION }}
      - name: 'Run the acceptance-selenium tests'
        run: headless_mode=true mvn clean test -P at,mysql --file pom.xml
      - name: 'Acceptance-Selenium Tests'' Summary'
        if: success() || failure()
        uses: test-summary/action@v2
        with:
          show: "fail"
          paths: "${{ env.UNIT_TESTS_XMLS_DIR }}"
      - name: 'Uploads the results to ${{ env.TESTS_UPLOADED_ARTIFACTS_DIR }}-${{ github.job }} folder'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TESTS_UPLOADED_ARTIFACTS_DIR }}-${{ github.job }} # Name of the folder
          path: target/test-results                                       # Path to test report
      - name: 'Report'
        id: acceptance_tests_report
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          fail-on-error: true
          reporter: java-junit
          name: 'Acceptance-Selenium Tests'' Report'
          path: ${{ env.UNIT_TESTS_XMLS_DIR }}
      - name: 'Add Test Report URL to Summary'
        if: success() || failure()
        run: |
          echo "### [View Acceptance Test Report](${{ steps.acceptance_tests_report.outputs.url_html }})" >> $GITHUB_STEP_SUMMARY
          echo "::notice title=Acceptance Test Report::[Click to view Acceptance Test Report](${{ steps.acceptance_tests_report.outputs.url_html }})"

  penetration-tests:
    runs-on: ubuntu-24.04

    steps:
      - name: 'Get the latest code from the `${{ github.repository }}` repository'
        uses: actions/checkout@v3
      - name: 'Set up GitHup runner'
        uses: './.github/actions/setup-runner'
        with:
          WITH_MYSQL: 'TRUE'
          WITH_GOOGLE_CHROME_INFO: 'TRUE'
          JAVA_VERSION_TO_INSTALL: ${{ env.JAVA_VERSION }}
      - name: 'Run the penetration tests'
        run: browser=chrome headless_mode=true environment=CI mvn clean test -P pt,mysql --file pom.xml
      - name: 'Penetration Tests'' Summary'
        if: success() || failure()
        uses: test-summary/action@v2
        with:
          show: "fail"
          paths: "${{ env.UNIT_TESTS_XMLS_DIR }}"
      # target/test-results were not uploaded earlier, see if it causes any issues in generated reports
      - name: 'Uploads the results to ${{ env.TESTS_UPLOADED_ARTIFACTS_DIR }}-${{ github.job }} folder'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TESTS_UPLOADED_ARTIFACTS_DIR }}-${{ github.job }} # Name of the folder
          path: target/test-results                                       # Path to test report
      - name: 'Uploads the site to ${{ env.UPLOADED_ARTIFACTS_DIR }}-${{ github.job }} folder'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.UPLOADED_ARTIFACTS_DIR }}-${{ github.job }} # Name of the folder
          path: target/site                                         # Path to site folder
      - name: 'Report'
        id: penetration_tests_report
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          fail-on-error: true
          reporter: java-junit
          name: 'Penetration Tests'' Report'
          path: ${{ env.UNIT_TESTS_XMLS_DIR }}
      - name: 'Add Test Report URL to Summary'
        if: success() || failure()
        run: |
          echo "### [View Penetration Test Report](${{ steps.penetration_tests_report.outputs.url_html }})" >> $GITHUB_STEP_SUMMARY
          echo "::notice title=Penetration Test Report::[Click to view Penetration Test Report](${{ steps.penetration_tests_report.outputs.url_html }})"

  site-generation:
    runs-on: ubuntu-24.04
    needs:
      - unit-tests
      - migration-tests
      - penetration-tests
      - bdd-cucumber-tests
      - integration-tests-mysql
      - acceptance-selenium-tests

    steps:
      - name: 'Get the latest code from the `${{ github.repository }}` repository'
        uses: actions/checkout@v3
      - name: 'Set up GitHup runner'
        uses: './.github/actions/setup-runner'
        with:
          JAVA_VERSION_TO_INSTALL: ${{ env.JAVA_VERSION }}
      - name: 'Download the test results'' artifacts'
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: target/test-results
          pattern: ${{ env.TESTS_UPLOADED_ARTIFACTS_DIR }}-*
      - name: 'Download the site artifacts'
        uses: actions/download-artifact@v4
        with:
          path: target/site
          merge-multiple: true
          pattern: ${{ env.UPLOADED_ARTIFACTS_DIR }}-*
      - name: 'Display structure of downloaded files'
        run: ls -R
        working-directory: target
      - name: 'Generate project site'
        run: mvn site -P nt --file pom.xml
      - name: 'Uploads the results to ${{ env.UPLOADED_ARTIFACTS_DIR }} folder'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.UPLOADED_ARTIFACTS_DIR }} # Name of the folder
          path: target/site                       # Path to test report
          overwrite: true
      - name: Delete artifacts
        uses: geekyeggo/delete-artifact@v5
        with:
            name: |
                ${{ env.UPLOADED_ARTIFACTS_DIR }}-*
                ${{ env.TESTS_UPLOADED_ARTIFACTS_DIR }}-*
            failOnError: false


